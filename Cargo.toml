[package]
name = "prism-lsp"
version = "0.1.0"
authors = ["Stephen Diehl <stephen.m.diehl@gmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/sdiehl/prism-lsp"
description = "Language server for the Prism programming language."

[dependencies]
crossbeam-channel = "0.5"
lsp-server = "0.7"
lsp-types = "0.95"
prism = { git = "https://github.com/sdiehl/prism", tag = "v0.24.0", default-features = false, features = ["project"] }
serde = "1"
serde_json = "1"

[profile.dev.package."*"]
opt-level = 2
