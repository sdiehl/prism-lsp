[package]
name = "prism-lsp"
version = "0.1.0"
authors = ["Stephen Diehl <stephen.m.diehl@gmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/sdiehl/prism-lsp"
description = "Language server for the Prism programming language."

[dependencies]
crossbeam-channel = "0.5"
lsp-server = "0.7"
lsp-types = "0.95"
prism = { git = "https://github.com/sdiehl/prism", rev = "efd909a39fe45526ef91eb6bf9890ca5851e4cf9", default-features = false }
serde = "1"
serde_json = "1"
toml = "0.9"

[profile.dev.package."*"]
opt-level = 2
