name: Release

# Cut a release by pushing a version tag (`git tag v0.1.0 && git push --tags`).
# The tag must name the Cargo.toml version and sit on a commit CI already passed.
# Each platform builds a server tarball with a checksum, one job packages the
# VS Code extension, and a publish job attaches everything to one GitHub
# Release whose body is the matching CHANGELOG.md section.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: main is green
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          concl="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=1" \
            -q '.workflow_runs[0] | "\(.status)/\(.conclusion)"' || true)"
          echo "CI for ${GITHUB_SHA}: ${concl:-<none>}"
          [ "$concl" = "completed/success" ] || { echo "tag a commit CI has passed"; exit 1; }

  build:
    name: ${{ matrix.target }}
    needs: gate
    if: ${{ always() && (!startsWith(github.ref, 'refs/tags/v') || needs.gate.result == 'success') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          manifest="$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"(.*)"/\1/')"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$manifest" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version $manifest"; exit 1
          fi
          echo "VERSION=$manifest" >> "$GITHUB_ENV"

      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo build --release --locked

      - name: Package
        run: |
          set -euo pipefail
          pkg="prism-lsp-${VERSION}-${{ matrix.target }}"
          mkdir "$pkg"
          cp target/release/prism-lsp LICENSE README.md "$pkg/"
          "$pkg/prism-lsp" --version
          tar -czf "$pkg.tar.gz" "$pkg"
          shasum -a 256 "$pkg.tar.gz" | tee "$pkg.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: prism-lsp-*.tar.gz*
          if-no-files-found: error

  vscode:
    name: VS Code extension
    needs: gate
    if: ${{ always() && (!startsWith(github.ref, 'refs/tags/v') || needs.gate.result == 'success') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run compile
      - run: npx vsce package --allow-missing-repository --skip-license -o prism-lsp.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vscode
          path: editors/vscode/prism-lsp.vsix
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [build, vscode]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## +\\[" v "\\]( - .+)?$" { f=1; print; next }
            f && /^## / { exit }
            f { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || echo "## ${version}" > RELEASE_NOTES.md
          (cd dist && sha256sum *.tar.gz *.vsix > SHA256SUMS)

      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.vsix
            dist/SHA256SUMS
